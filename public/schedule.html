<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        body{
            background-color: #121826;
        }
        .date{
            font-size: 15px;
            color: #7a7878;
        }
        header,main{
            max-width:420px;
            margin:0 auto;
            padding:20px;
        }
        h1{
            color: #FFFFFF;
            text-align:center;
            font-size:28px;
            margin-bottom:20px;
        }
       
        .days-grid{
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #schedule-days{
            display:flex;
            gap:6px;
            flex:1;
        }
        .day-button{
            flex: 1;
            width: auto;
            border: 1px solid #2E374A;
            background-color: #1E2433;
            color:#FFFFFF;
            border-radius:12px;
            padding:10px 0;
            cursor:pointer;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:4px;
            transition: 250ms;
        }
        .day-button.active{
            background-color: #7063ff;
        }
        .day-button:hover{
            background-color: #7063ff;
        }
        .day-name{
            font-size:12px;
            color:#FFFFFF;
        }

        .day-date{
            font-size:16px;
            font-weight:600;
        }
        #prev-week,#next-week{
            background-color: transparent;
            border: none;
            color: #FFFFFF;
            font-size: 24px;
            cursor: pointer;
            transition: 250ms;
        }
        #prev-week:hover,#next-week:hover{
            color: #a7a2a2;
        }
        .lesson-card{
            min-height: 160px;
            padding: 16px;
            border-radius: 12px;
            background: #1E2433;
            border: 1px solid #2E374A;
            margin-bottom: 10px;
        }
        .lesson-header{
            display:flex;
            justify-content:space-between;
            margin-bottom:12px;
        }
        .lesson-time{
            color:#b8c0d4;
        }
        .lesson-info{
            justify-content: flex-start;
            display:flex;
            gap:10px;
            color:#8f98b3;
            font-size:14px; 
        }
        .lesson-type{
            color: #FFFFFF;
            border: 1px solid #FFFFFF;
            padding:4px 10px;
            border-radius:8px;
            font-size:12px;
        }

        .lesson-subject{
            color: #FFFFFF;
            font-size:16px;
            font-weight:600;
            margin-bottom:8px;
        }

        .lesson-teacher,.lesson-room,.corpus,.subgroup{
            color:#8f98b3;
            font-size:14px;
            margin-top:4px;
        }
        .week-range{
            text-align:center;
            color:#8f98b3;
            margin-bottom:20px;
            font-size:14px;
        }
        #prev-week:disabled,#next-week:disabled{
            color: #4b5263;
            opacity: 0.5;
        }

        #prev-week:disabled:hover,#next-week:disabled:hover{
            color: #4b5263;
        }
        #button-back{
            display: flex;
            color: #FFFFFF;
            background-color: transparent;
            border: none;
            transition:250ms ;
        }
        #button-back:hover{
            color: #a7a2a2;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <header>
        <p class="date"></p>
        <h1>Ваше расписание</h1>
        <p class="week-range"></p>
        <div class="days-grid">
            <button id="prev-week">❮</button>
            <div id="schedule-days"></div>
            <button id="next-week">❯</button>
        </div>
    </header>
    <main>
        <div class="Schedule">

        </div>
        <div class="button-back">
            <button id="button-back">← Назад</button>
        </div>
    </main>
</body>
<template id="day-template">
    <button class="day-button">
        <div class="day-name"></div>
        <div class="day-date"></div>
    </button>
</template>
<template id="lesson-template">
    <div class="lesson-card">
        <div class="lesson-header">
            <div class="lesson-info">
                <span class="lesson-time"></span>
                <span class="lesson-number"></span>
            </div>
            <div class="lesson-type"></div>
        </div>
        <p class="lesson-subject"></p>
        <p class="lesson-teacher"></p>
        <p class="lesson-room"></p>
        <p class="corpus"></p>
        <p class="subgroup"></p>
    </div>
</template>
<script>
    let group = new URLSearchParams(window.location.search).get('group');
    let teacher = new URLSearchParams(window.location.search).get('teacher');
    let room = new URLSearchParams(window.location.search).get('room');
    let corpus = new URLSearchParams(window.location.search).get('corpus');
    let scheduleUrl;

    if (group) {
        scheduleUrl = `/api/schedule/${encodeURIComponent(group)}`;
    } else if (teacher) {
        scheduleUrl = `/api/teacher/${encodeURIComponent(teacher)}`;
    } else if (room) {
        scheduleUrl = `/api/auditorium/${encodeURIComponent(room)}?corpus=${encodeURIComponent(corpus)}`;
    }
    
    let weekOffset = 0;
    document.querySelector('.date').textContent = new Date().toLocaleDateString('sv-SE');
    function updateShedule(){
        let now = new Date();

        let dayOfWeek = now.getDay()
        if(dayOfWeek == 0){
            dayOfWeek = 7;
        }
        let monday = new Date(now);
        monday.setDate(now.getDate() - (dayOfWeek - 1) + (weekOffset * 7));
        let sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        document.querySelector('.week-range').textContent = `${monday.getDate()}.${monday.getMonth()+1} - ${sunday.getDate()}.${sunday.getMonth()+1}`;
        document.getElementById('schedule-days').innerHTML = '';
        
        let dayName = [ 'Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

        for (let i = 0; i < 7; i++) {

            let date = new Date(monday);
            date.setDate(monday.getDate() + i);
            let clone = document.getElementById('day-template').content.cloneNode(true);
            let apiDate = date.toLocaleDateString('sv-SE');
                clone.querySelector('.day-button').dataset.date = apiDate
                clone.querySelector('.day-name').textContent = dayName[i];
                clone.querySelector('.day-date').textContent = date.getDate();
                clone.querySelector('.day-button').addEventListener('click', e => {
                    document.querySelectorAll('.day-button').forEach(button => {
                        button.classList.remove('active');
                    });

                    e.currentTarget.classList.add('active');
                    if(group){
                        let day = scheduleData.find(item => item.date == apiDate)
                        renderDay(day);
                    }
                    else if(teacher){
                        renderTeacherDay(apiDate);
                    }
                    else if(room){
                        renderTeacherDay(apiDate)
                    }
                
            });
                
            document.getElementById('schedule-days').appendChild(clone);
        }
    }
    document.getElementById('prev-week').addEventListener('click', async e=>{
        if (weekOffset <= 0) {
            return
        }
        weekOffset--;
        if (weekOffset <= 0) {
            document.getElementById('prev-week').disabled = true;
        }
        document.getElementById('next-week').disabled = false;
        let now = new Date();
        let dayOfWeek = now.getDay() || 7;
        
        let monday = new Date(now);
        monday.setHours(0, 0, 0, 0);
        monday.setDate(now.getDate() - (dayOfWeek - 1) + weekOffset * 7);
        
        let timestamp = Math.floor(monday.getTime() / 1000);
        let fetchUrl;

        if (room) {
            fetchUrl = scheduleUrl;
        }
        else if(teacher){
            fetchUrl = scheduleUrl;
        }  
        else {
            fetchUrl = `${scheduleUrl}?timestamp=${timestamp}`;
        }

        let resp = await fetch(fetchUrl);
        let data = await resp.json()
        scheduleData = Object.values(data).filter(item => item.date);
        updateShedule();
        if(group){
            renderDay(scheduleData[0]);
        }
        else if(teacher){
            renderTeacherDay(monday.toLocaleDateString('sv-SE'))
        }
        else if(room){
            renderTeacherDay(monday.toLocaleDateString('sv-SE'))
        }

        document.querySelectorAll('.day-button').forEach(button => {
            if(button.dataset.date == monday.toLocaleDateString('sv-SE')){
                button.classList.toggle('active');
            }
        });
    })
        document.getElementById('next-week').addEventListener('click', async e=>{
        weekOffset++;
        document.getElementById('prev-week').disabled = false;
        if ((teacher || room) && weekOffset >= 1) {
            document.getElementById('next-week').disabled = true;
        }
        let now = new Date();
        let dayOfWeek = now.getDay() || 7;

        let monday = new Date(now);
        monday.setHours(0, 0, 0, 0);
        monday.setDate(now.getDate() - (dayOfWeek - 1) + weekOffset * 7);
        let timestamp = Math.floor(monday.getTime() / 1000);
        let fetchUrl;

        if (room) {
            fetchUrl = scheduleUrl;
        }
        else if(teacher){
            fetchUrl = scheduleUrl;
        } 
        else {
            fetchUrl = `${scheduleUrl}?timestamp=${timestamp}`;
        }
        let resp = await fetch(fetchUrl)
        let data = await resp.json()
        scheduleData = Object.values(data).filter(item => item.date);
        updateShedule();
        if(group){
            renderDay(scheduleData[0]);
        }
        else if(teacher){
            renderTeacherDay(monday.toLocaleDateString('sv-SE'));
        }
        else if(room){
            renderTeacherDay(monday.toLocaleDateString('sv-SE'))
        }

        document.querySelectorAll('.day-button').forEach(button => {
            if(button.dataset.date == monday.toLocaleDateString('sv-SE')){
                button.classList.toggle('active');
            }
        }); 
    })
    updateShedule()
    document.getElementById('prev-week').disabled = true;
    let scheduleData = [];
    let timestamp = new URLSearchParams(window.location.search).get('timestamp');
    let fetchUrl;

    if (room) {
        fetchUrl = scheduleUrl;
    }
    else if(teacher){
        fetchUrl = scheduleUrl;
    } 
    else {
        fetchUrl = `${scheduleUrl}?timestamp=${timestamp}`;
    }
    fetch(fetchUrl)
    .then(resp => resp.json())
    .then(data => {
        scheduleData = Object.values(data).filter(item => item.date);

        console.log(scheduleData);
        let todayDate = new Date().toLocaleDateString('sv-SE');

        if(group){
            let currentDay = scheduleData.find(item => item.date == todayDate);
            renderDay(currentDay);
        }
        else if(teacher){
            renderTeacherDay(todayDate);
        }
        else if(room){
            renderTeacherDay(todayDate);
        }
        document.querySelectorAll('.day-button').forEach(button => {
            if (button.dataset.date == todayDate) {
                button.classList.add('active');
            }
        })   
    });
    
    function renderDay(day){
    
        document.querySelector('.Schedule').innerHTML = '';
        if(!day){
            let p = document.createElement('p')
            p.textContent = 'На этот день занятий нет';
            p.style.color = '#FFFFFF';
            p.style.textAlign = 'center';
            document.querySelector('.Schedule').appendChild(p)
            return
        }
            day.list.forEach(lesson => {
                let clone = document.getElementById('lesson-template').content.cloneNode(true);
                clone.querySelector('.lesson-time').textContent = `${lesson.timeStart} - ${lesson.timeEnd}`;
                clone.querySelector('.lesson-number').textContent = `${lesson.number} пара`;
                clone.querySelector('.lesson-type').textContent = lesson.types;
                clone.querySelector('.lesson-subject').textContent = lesson.disciplines;
                clone.querySelector('.lesson-teacher').textContent = lesson.teachers;
                clone.querySelector('.lesson-room').textContent = `Кабинет: ${lesson.auditorium}`;
                clone.querySelector('.corpus').textContent = `Корпус: ${lesson.corpus}`;
                if(lesson.subgroup > 0){
                    clone.querySelector('.subgroup').textContent = `Подгруппа: ${lesson.subgroup}`;
                }
                document.querySelector('.Schedule').appendChild(clone);
        });
    };
    function renderTeacherDay(date){

        document.querySelector('.Schedule').innerHTML = '';

        let lessons = scheduleData.filter(item =>
            new Date(item.date).toLocaleDateString('sv-SE') == date
        );

        if(lessons.length == 0){
            let p = document.createElement('p');
            p.textContent = 'На этот день занятий нет';
            p.style.color = '#FFFFFF';
            p.style.textAlign = 'center';
            document.querySelector('.Schedule').appendChild(p);
            return;
        }

        lessons.forEach(lesson => {
            let clone = document.getElementById('lesson-template').content.cloneNode(true);
            clone.querySelector('.lesson-time').textContent = `${lesson.time_start.slice(0, 5)} - ${lesson.time_end.slice(0, 5)}`;
            clone.querySelector('.lesson-number').textContent = `${lesson.number} пара`;
            clone.querySelector('.lesson-type').textContent = lesson.type;
            clone.querySelector('.lesson-subject').textContent = lesson.discipline;
            clone.querySelector('.lesson-teacher').textContent = lesson.teacher;
            clone.querySelector('.lesson-room').textContent = `Кабинет: ${lesson.auditorium}`;
            clone.querySelector('.corpus').textContent = `Корпус: ${lesson.corpus}`;
            if(lesson.subgroup > 0){
                clone.querySelector('.subgroup').textContent = `Подгруппа: ${lesson.subgroup}`;
            }
            document.querySelector('.Schedule').appendChild(clone);
        });
    }
    document.getElementById('button-back').addEventListener('click',e=>{
        history.back();
    })
</script>
</html>

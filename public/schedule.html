<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        body{
            background-color: #121826;
        }
        .date{
            font-size: 15px;
            color: #7a7878;
        }
        header,main{
            max-width:420px;
            margin:0 auto;
            padding:20px;
        }
        h1{
            color: white;
            text-align:center;
            font-size:28px;
            margin-bottom:20px;
        }
       
        .days-grid{
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #schedule-days{
            display:flex;
            gap:6px;
            flex:1;
        }
        .day-button{
            flex: 1;
            width: auto;
            border: 1px solid #2E374A;
            background-color: #1E2433;
            color:#FFFFFF;
            border-radius:12px;
            padding:10px 0;
            cursor:pointer;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:4px;
            transition: 250ms;
        }
        .day-button.active{
            background-color: #7063ff;
        }
        .day-button:hover{
            background-color: #7063ff;
        }
        .day-name{
            font-size:12px;
            color:#FFFFFF;
        }

        .day-date{
            font-size:16px;
            font-weight:600;
        }
        #prev-week,#next-week{
            background-color: transparent;
            border: none;
            color: #FFFFFF;
            font-size: 24px;
            cursor: pointer;
            transition: 250ms;
        }
        #prev-week:hover,#next-week:hover{
            color: #a7a2a2;
        }
        .lesson-card{
            min-height: 160px;
            padding: 16px;
            border-radius: 12px;
            background: #1E2433;
            border: 1px solid #2E374A;
            margin-bottom: 10px;
        }
        .lesson-header{
            display:flex;
            justify-content:space-between;
            margin-bottom:12px;
        }
        .lesson-time{
            color:#b8c0d4;
        }
        .lesson-info{
            justify-content: flex-start;
            display:flex;
            gap:10px;
            color:#8f98b3;
            font-size:14px; 
        }
        .lesson-type{
            background:#7063ff;
            padding:4px 10px;
            border-radius:8px;
            font-size:12px;
        }

        .lesson-subject{
            color: #FFFFFF;
            font-size:16px;
            font-weight:600;
            margin-bottom:8px;
        }

        .lesson-teacher,.lesson-room,.corpus{
            color:#8f98b3;
            font-size:14px;
            margin-top:4px;
        }
        .week-range{
            text-align:center;
            color:#8f98b3;
            margin-bottom:20px;
            font-size:14px;
        }

    </style>
</head>
<body>
    <header>
        <p class="date"></p>
        <h1>Ваше расписание</h1>
        <p class="week-range"></p>
        <div class="days-grid">
            <button id="prev-week">❮</button>
            <div id="schedule-days"></div>
            <button id="next-week">❯</button>
        </div>
    </header>
    <main>
        
    </main>
</body>
<template id="day-template">
    <button class="day-button">
        <div class="day-name"></div>
        <div class="day-date"></div>
    </button>
</template>
<template id="lesson-template">
    <div class="lesson-card">
        <div class="lesson-header">
            <div class="lesson-info">
                <span class="lesson-time"></span>
                <span class="lesson-number"></span>
            </div>
            <div class="lesson-type"></div>
        </div>
        <p class="lesson-subject"></p>
        <p class="lesson-teacher"></p>
        <p class="lesson-room"></p>
        <p class="corpus"></p>
    </div>
</template>
<script>
    let params = new URLSearchParams(window.location.search);
    let group = params.get('group');
    let teacher = params.get('teacher');
    let room = params.get('room');
    console.log(group);
    
    let weekOffset = 0;
    document.querySelector('.date').textContent = new Date().toLocaleDateString('ru-RU');
    function updateShedule(){
        let now = new Date();
        let dayOfWeek = now.getDay()
        if(dayOfWeek == 0){
            dayOfWeek = 7;
        }
        let monday = new Date(now);
        monday.setDate(now.getDate() - (dayOfWeek - 1) + (weekOffset * 7));
        let sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        document.querySelector('.week-range').textContent = `${monday.getDate()}.${monday.getMonth()+1} - ${sunday.getDate()}.${sunday.getMonth()+1}`;
        document.getElementById('schedule-days').innerHTML = '';
        
        let dayName = [ 'Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

        for (let i = 0; i < 7; i++) {

            let date = new Date(monday);
            date.setDate(monday.getDate() + i);
            let clone = document.getElementById('day-template').content.cloneNode(true);

                clone.querySelector('.day-name').textContent = dayName[i];
                clone.querySelector('.day-date').textContent = date.getDate();

                if ( weekOffset == 0 && date.toDateString() == new Date().toDateString()) {
                    clone.querySelector('.day-button').classList.add('active');
                }
            document.getElementById('schedule-days').appendChild(clone);
        }
    }
    document.getElementById('prev-week').addEventListener('click', e=>{
        weekOffset--;
        updateShedule()
    })
    document.getElementById('next-week').addEventListener('click', e=>{
        weekOffset++;
        updateShedule()
    })
    updateShedule()
</script>
</html>
